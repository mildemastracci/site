<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f4ee; /* Warm soft ivory background */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #fdfbf7; /* Crisp off-white/ivory card surface */
      width: 100%;
      max-width: 450px;
      padding: 44px;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(74, 63, 53, 0.06);
      border: 1px solid #e8e2d5; /* Subtle beige border */
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2c251e; /* Rich espresso dark tone */
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .description {
      font-size: 0.95rem;
      color: #786c60; /* Muted warm taupe */
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #efe8db;
      padding-top: 22px;
    }

    .contact-info a {
      color: #4a3f35; /* Deep warm earth color */
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .contact-info a:hover {
      color: #a3723f; /* Soft bronze accent on hover */
    }
  </style>
</head>
<body>

  <main class="card">
    <h1 class="name">Milde Mastracci</h1>
    <p class="description">Civilingenjörsstudent inom teknisk fysik på KTH</p>
    
    <div class="contact-info">
      <a href="tel:+1234567890">+46 70 988 88 75</a>
      <a href="mailto:your.email@example.com">milde@mastracci.se</a>
    </div>
  </main>

</body>
</html>
